# Nginx config for livehospital.org
# Copy to: /etc/nginx/sites-available/livehospital.org
# Then: sudo ln -s /etc/nginx/sites-available/livehospital.org /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name livehospital.org www.livehospital.org;
    return 301 https://livehospital.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name livehospital.org www.livehospital.org;

    # Certbot will fill these paths after: sudo certbot --nginx -d livehospital.org -d www.livehospital.org
    ssl_certificate /etc/letsencrypt/live/livehospital.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livehospital.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
