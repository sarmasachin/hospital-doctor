# LiveHospital — public + admin panel (no mix with govmocktest.com)
# cp deploy/nginx-livehospital.conf /etc/nginx/sites-available/livehospital.org
# ln -sf /etc/nginx/sites-available/livehospital.org /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
# certbot --nginx -d livehospital.org -d www.livehospital.org -d panel.livehospital.org
#
# PUBLIC : https://livehospital.org
# ADMIN  : https://panel.livehospital.org/admin.html
#          https://panel.livehospital.org/hospital-admin.html
#          https://panel.livehospital.org/blood-admin.html
# API    : same origin as each host (Node PM2 on 127.0.0.1:5006)

upstream livehospital_node {
    server 127.0.0.1:5006;
    keepalive 16;
}

# ---------- HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name livehospital.org www.livehospital.org panel.livehospital.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- PUBLIC SITE ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name livehospital.org www.livehospital.org;

    ssl_certificate     /etc/letsencrypt/live/livehospital.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livehospital.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Admin only on panel subdomain — redirect old URLs
    location ~ ^/(admin|hospital-admin|blood-admin)(\.html)?/?$ {
        return 301 https://panel.livehospital.org$uri;
    }

    location / {
        proxy_pass http://livehospital_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---------- ADMIN PANEL (all admin roles) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.livehospital.org;

    ssl_certificate     /etc/letsencrypt/live/livehospital.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livehospital.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location = / {
        return 301 https://panel.livehospital.org/admin.html;
    }

    location / {
        proxy_pass http://livehospital_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---------- IP / unknown host (stop mocktest default on 187.127.154.196) ----------
# Only catches raw IP or unknown Host — NOT livehospital.org / panel subdomain.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://livehospital.org$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/livehospital.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livehospital.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://livehospital.org$request_uri;
}
