<!DOCTYPE html>
<html lang="hi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Security Meta Tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <!-- X-Frame-Options should be set via HTTP header, not meta tag -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://www.googletagmanager.com;">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="LiveHospital - Check doctor availability in hospitals. जानें कि आज आपके डॉक्टर हॉस्पिटल में उपलब्ध हैं या नहीं।">
    <meta name="keywords" content="doctor availability, hospital, medical, health, डॉक्टर, हॉस्पिटल, स्वास्थ्य">
    <meta name="author" content="LiveHospital">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="LiveHospital - Doctor Availability System">
    <meta property="og:description" content="Check doctor availability in hospitals near you">
    <meta property="og:type" content="website">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#f8fafc">
    <meta name="msapplication-navbutton-color" content="#f8fafc">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>LiveHospital - Doctor Availability | आज डॉक्टर उपलब्ध हैं?</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/site-chrome.css">
    <script src="/error-handler.js"></script>
    <script src="/offline-status.js"></script>
    <script src="/contact-config.js"></script>
    <script src="/seo-bootstrap.js" defer></script>
</head>
<body data-active-page="home">
    <div id="lh-site-header"></div>

    <!-- Hero Section with Search -->
    <section class="hero">
        <div class="container">
            <h1>डॉक्टर की उपलब्धता चेक करें</h1>
            <p>जानें कि आज आपके पसंदीदा डॉक्टर हॉस्पिटल में उपलब्ध हैं या नहीं</p>
            
            <div id="searchError" class="search-error"></div>
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="हॉस्पिटल का नाम खोजें..." autocomplete="off">
                    <button type="button" class="btn-search-location" id="searchLocationBtn" onclick="requestLocation()" title="नज़दीकी हॉस्पिटल — Location चालू करें" aria-label="नज़दीकी हॉस्पिटल — Location चालू करें">📍</button>
                    <button type="button" class="btn btn-search" onclick="searchHospitals()">खोजें</button>
                </div>
                <div id="searchSuggestions" class="search-suggestions"></div>
            </div>

        </div>
    </section>

    <!-- Hospital Cards Section -->
    <section class="hospitals-section" id="hospitals">
        <div class="container">
            <div class="hospitals-grid" id="hospitalsGrid">
                <!-- Hospital cards will be inserted here by JavaScript -->
            </div>
        </div>
    </section>

    <div id="lh-site-footer"></div>

    <script src="/site-chrome.js"></script>
    <script src="/script.js"></script>
</body>
</html>
